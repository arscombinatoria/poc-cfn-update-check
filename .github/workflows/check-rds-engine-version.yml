name: Check RDS Engine Version Updates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - cloudformation.yml
      - .github/script/check_rds_engine_updates.py
      - .github/workflows/check-rds-engine-version.yml
  schedule:
    # 06:00 Asia/Tokyo (GitHub Actions schedule uses UTC)
    - cron: "0 21 * * *"

permissions:
  contents: read
  issues: write

jobs:
  check-rds-engine-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint

      - name: Check RDS engine updates from cfn-lint data
        id: check
        run: |
          python .github/script/check_rds_engine_updates.py --template cloudformation.yml

      - name: Create issue when update exists
        if: steps.check.outputs.has_update == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = ${{ toJSON(steps.check.outputs.issue_title) }};
            const body = ${{ toJSON(steps.check.outputs.issue_body) }};

            const { owner, repo } = context.repo;

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            });

            const duplicate = existing.data.find((issue) => issue.title === title);
            if (duplicate) {
              core.info(`Issue already exists: #${duplicate.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['dependencies', 'rds'],
            });

            core.info(`Created issue #${created.data.number}`);
